name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"
  FOUNDATION_COMMON_SHA: "1c14ab26ffa9923825d8ccecc99c72f07c66c9a7"
  FOUNDATION_PROTO_SHA: "966a023140e51f20a98277485a553b8e80c2e6f0"

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Bootstrap pre-release foundations
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/bootstrap-foundations
        with:
          common-sha: ${{ env.FOUNDATION_COMMON_SHA }}
          proto-sha: ${{ env.FOUNDATION_PROTO_SHA }}
          read-token: ${{ secrets.FOUNDATION_READ_TOKEN }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: govulncheck
        run: |
          env GOFLAGS= GOTOOLCHAIN=go1.26.6 go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOTOOLCHAIN=go1.26.6 govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Bootstrap pre-release foundations
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/bootstrap-foundations
        with:
          common-sha: ${{ env.FOUNDATION_COMMON_SHA }}
          proto-sha: ${{ env.FOUNDATION_PROTO_SHA }}
          read-token: ${{ secrets.FOUNDATION_READ_TOKEN }}

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats \
            -p 4222:4222 -p 8222:8222 \
            -v "$PWD/docker/nats.conf:/etc/nats/nats.conf:ro" \
            nats:2.10-alpine -c /etc/nats/nats.conf
          sleep 2
          wget -q --spider http://localhost:8222/healthz

      - name: Run tests
        run: go test ./... -race -cover -coverprofile=coverage.out
        env:
          NATS_URL: nats://localhost:4222

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=40
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below minimum threshold of ${THRESHOLD}%"
            exit 1
          fi
